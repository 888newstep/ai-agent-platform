# ============================================
# AI Agent Platform — CI/CD Pipeline
# ============================================
# 触发条件：
#   - push 到 main/master 分支
#   - 任何 PR
#
# 流程：
#   1. Checkout 代码
#   2. 设置 JDK 17
#   3. 使用 Maven 编译 & 测试
#   4. 构建 Docker 镜像
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==================== 编译 & 测试 ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 创建 .env 文件（CI 用默认值）
        run: |
          cp .env.example .env

      - name: Maven 编译
        run: mvn compile -B

      - name: Maven 测试
        run: mvn test -B
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          QIANWEN_API_KEY: ${{ secrets.QIANWEN_API_KEY || '' }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || '' }}
          QWEN3_FLASH_API_KEY: ${{ secrets.QWEN3_FLASH_API_KEY || '' }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY || '' }}
          JWT_SECRET: test-jwt-secret-for-ci-only

      - name: Maven 打包
        run: mvn package -DskipTests -B

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/ai-agent-platform-*.jar

  # ==================== Docker 镜像构建 ====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    # 仅在 push 到 main/master 时构建 Docker 镜像
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-agent-platform:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-agent-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 代码质量检查 ====================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven 编译检查
        run: mvn compile -B