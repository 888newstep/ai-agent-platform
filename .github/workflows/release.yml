name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build (skip tests; CI runs them on main)
        run: mvn -B -DskipTests package

      - name: Extract release notes from tag message
        id: notes
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "${TAG_MSG// }" ]; then
            TAG_MSG="Release ${GITHUB_REF_NAME}. See commit history for details."
          fi
          {
            echo 'body<<EOF'
            echo "$TAG_MSG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: target/*.jar
          generate_release_notes: true
