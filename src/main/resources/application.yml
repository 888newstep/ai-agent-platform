server:
  port: 8081
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 100

spring:
  application:
    name: ai-agent-platform

  mvc:
    async:
      request-timeout: 300000

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_agent}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        'format_sql': true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: -1ms
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

ai:
  model:
    # supported chat providers: deepseek | qianwen | doubao | qwen3-flash | local
    # non-local providers automatically degrade to the local model; no separate fallback toggle is exposed
    provider: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-api-key}
      model-name: deepseek-chat-v2
      base-url: https://api.deepseek.com/v1
    qianwen:
      api-key: ${QIANWEN_API_KEY:your-api-key}
      model-name: qwen3.7-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    doubao:
      api-key: ${DOUBAO_API_KEY:}
      model-name: doubao-seed-2-0-mini-260428
      base-url: https://ark.cn-beijing.volces.com/api/v3
    qwen3-flash:
      api-key: ${QWEN3_FLASH_API_KEY:}
      model-name: qwen3.7-flash
      base-url: https://ws-saj0dk2icyo8g1ub.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    local:
      base-url: http://localhost:11434/v1
      model-name: coder:qwen7b
      api-key: dummy

  embedding:
    # supported embedding providers: deepseek | qianwen | local | local-qwen3 | siliconflow
    # provider: local          -> bge-m3 on a local OpenAI-compatible endpoint
    # provider: local-qwen3    -> qwen3-embedding:4b via local Ollama-compatible endpoint
    # provider: siliconflow    -> hosted BAAI/bge-m3
    provider: siliconflow
    local:
      base-url: http://localhost:11434/v1
      model-name: bge-m3
      dimension: 1024
    local-qwen3:
      base-url: http://localhost:11434/v1
      model-name: qwen3-embedding:4b
      dimension: 1024
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:}
      model-name: BAAI/bge-m3
      base-url: https://api.siliconflow.cn/v1
      dimension: 1024

  vector-store:
    # supported vector stores: milvus | inmemory
    # mode: langchain (default) | qa (Milvus V2 question-answer schema)
    type: milvus
    mode: ${AI_VECTOR_STORE_MODE:langchain}
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      collection-name: ${MILVUS_COLLECTION_NAME:ai_agent_documents}
      dimension: 1024
      connection-timeout-ms: ${MILVUS_CONNECTION_TIMEOUT_MS:2000}
      read-only: ${MILVUS_READ_ONLY:false}
  document:
    chunk-size: 500
    chunk-overlap: 50

  rag:
    top-k: 5
    similarity-threshold: 0.7
    enable-hybrid-search: true
    adaptive:
      enabled: true
      max-retrieval-rounds: 2
      max-context-chunks: 5
      verification-threshold: 0.18
      multi-hop-threshold: 0.28
      direct-threshold: 0.45
      min-keyword-count: 2

  evaluation:
    dataset-directory: ${AI_EVALUATION_DATASET_DIRECTORY:./examples/evaluation-datasets}
    report-directory: ${AI_EVALUATION_REPORT_DIRECTORY:./evaluation-reports}
  protection:
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${AI_RATE_LIMIT_REQUESTS_PER_MINUTE:30}
      fail-open: ${AI_RATE_LIMIT_FAIL_OPEN:true}
    cost-budget:
      enabled: ${AI_COST_BUDGET_ENABLED:true}
      estimated-tokens-per-minute: ${AI_ESTIMATED_TOKENS_PER_MINUTE:12000}
      max-estimated-tokens-per-request: ${AI_MAX_ESTIMATED_TOKENS_PER_REQUEST:4000}
      max-input-characters: ${AI_MAX_INPUT_CHARACTERS:12000}
      tokens-per-character: ${AI_TOKENS_PER_CHARACTER:1.0}
      prompt-overhead-tokens: ${AI_PROMPT_OVERHEAD_TOKENS:256}
      fail-open: ${AI_COST_BUDGET_FAIL_OPEN:true}
  tool:
    database-query:
      enabled: true
      max-rows: 100
      allowed-tables: conversations,messages,documents,document_chunks,users,ecommerce_qa_pairs,ecommerce_feedback,message_classify_log,vision_analysis_cache
    api-call:
      enabled: true
      timeout: 30000
      allowed-methods: GET,POST
      # empty allowlist disables outbound API calls; private/loopback hosts are always rejected
      allowed-hosts: ${AI_TOOL_ALLOWED_HOSTS:api.example.com}
      max-response-chars: 8000

  session:
    ttl: 86400
    max-messages: 100
    sliding-window-size: 10
    summary-interval: 5

  security:
    admin-api-key: ${ADMIN_API_KEY:}
    admin-header-name: X-Admin-Api-Key
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 86400000
    cors:
      allowed-origins: ${AI_CORS_ALLOWED_ORIGINS:http://localhost:8081}
      allowed-methods: ${AI_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${AI_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Admin-Api-Key,X-Requested-With}
      allow-credentials: ${AI_CORS_ALLOW_CREDENTIALS:false}
      max-age: ${AI_CORS_MAX_AGE:3600}

  observability:
    public-metrics: ${AI_ACTUATOR_PUBLIC_METRICS:false}
  performance:
    async-thread-pool:
      core-size: 20
      max-size: 100
      queue-capacity: 200
    cache:
      ttl: 3600

# =============================================
# Resilience4j Configuration
# =============================================
resilience4j:
  circuitbreaker:
    instances:
      llmChat:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.aiagent.infrastructure.config.ResilientChatLanguageModel$LlmServiceUnavailableException
  retry:
    instances:
      llmChat:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

logging:
  level:
    root: INFO
    com.aiagent: INFO
    dev.langchain4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-agent.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: ${AI_ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${AI_ACTUATOR_HEALTH_DETAILS:never}
  metrics:
    tags:
      application: ai-agent-platform
    distribution:
      percentiles-histogram:
        ai.chat.latency: true
        ai.rag.search.latency: true
        ai.document.ingestion.latency: true

# =============================================
# 电商客服知识库导入配置
# =============================================
ecommerce:
  ollama:
    host: http://localhost:11434
    model: bge-m3
    dimension: 1024
  milvus:
    collection: ecommerce_qa
    dimension: 1024
  import:
    batch-size: 18
    batch-interval-ms: 200
  generator:
    # 每个类别生成的目标 QA 对数量（100x 提升，预算 3.0 元可支撑 ~8100 条）
    target-per-category: 500
    # 单次 API 调用生成的条目数（增大减少 API 调用次数）
    batch-size: 20
    # 要生成的类别列表（留空使用默认 8 个类别）
    categories:

# =============================================
# 客服训练数据导入配置
# =============================================
cs:
  import:
    data-dir: ${CS_IMPORT_DATA_DIR:}
    batch-size: 18
