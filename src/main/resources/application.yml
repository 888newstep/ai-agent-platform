server:
  port: 8081
  jetty:
    threads:
      max: 200
      min: 20
      max-queue-capacity: 100
    max-connections: 10000

spring:
  application:
    name: ai-agent-platform

  mvc:
    async:
      request-timeout: 300000

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_agent}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:50}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:10}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${MYSQL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${MYSQL_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        'format_sql': true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:100}
          max-idle: ${REDIS_POOL_MAX_IDLE:50}
          min-idle: ${REDIS_POOL_MIN_IDLE:10}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
      timeout: ${REDIS_TIMEOUT:3000ms}

  servlet:
    multipart:
      max-file-size: ${AI_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${AI_UPLOAD_MAX_REQUEST_SIZE:20MB}
      enabled: true

ai:
  model:
    # supported chat providers: deepseek | qianwen | doubao | qwen3-flash | local
    # non-local providers automatically degrade to the local model; no separate fallback toggle is exposed
    provider: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-api-key}
      model-name: deepseek-chat-v2
      base-url: https://api.deepseek.com/v1
    qianwen:
      api-key: ${QIANWEN_API_KEY:your-api-key}
      model-name: qwen3.7-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    doubao:
      api-key: ${DOUBAO_API_KEY:}
      model-name: doubao-seed-2-0-mini-260428
      base-url: https://ark.cn-beijing.volces.com/api/v3
    qwen3-flash:
      api-key: ${QWEN3_FLASH_API_KEY:}
      model-name: qwen3.7-flash
      base-url: https://ws-saj0dk2icyo8g1ub.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    local:
      base-url: http://localhost:11434/v1
      model-name: coder:qwen7b
      api-key: dummy

  embedding:
    # supported embedding providers: deepseek | qianwen | local | local-qwen3 | siliconflow
    # provider: local          -> bge-m3 on a local OpenAI-compatible endpoint
    # provider: local-qwen3    -> qwen3-embedding:4b via local Ollama-compatible endpoint
    # provider: siliconflow    -> hosted BAAI/bge-m3
    provider: siliconflow
    local:
      base-url: http://localhost:11434/v1
      model-name: bge-m3
      dimension: 1024
    local-qwen3:
      base-url: http://localhost:11434/v1
      model-name: qwen3-embedding:4b
      dimension: 1024
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:}
      model-name: BAAI/bge-m3
      base-url: https://api.siliconflow.cn/v1
      dimension: 1024

  vector-store:
    # supported vector stores: milvus | inmemory
    # mode: langchain (default) | qa (Milvus V2 question-answer schema)
    type: milvus
    mode: ${AI_VECTOR_STORE_MODE:langchain}
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      database-name: ${MILVUS_DATABASE_NAME:cs_agent}
      collection-name: ${MILVUS_COLLECTION_NAME:ai_agent_documents}
      # FAQ 级联检索：FAQ 库优先命中，未命中回退 raw 库
      faq-collection-name: ${MILVUS_FAQ_COLLECTION_NAME:ecommerce_faq}
      faq-hit-threshold: ${MILVUS_FAQ_HIT_THRESHOLD:0.75}
      faq-top-k: ${MILVUS_FAQ_TOP_K:3}
      faq-first-enabled: ${MILVUS_FAQ_FIRST_ENABLED:false}
      dimension: 1024
      connection-timeout-ms: ${MILVUS_CONNECTION_TIMEOUT_MS:2000}
      read-only: ${MILVUS_READ_ONLY:false}
      fallback-enabled: ${MILVUS_FALLBACK_ENABLED:false}
  document:
    chunk-size: 500
    chunk-overlap: 50
    staging-directory: ${AI_DOCUMENT_STAGING_DIRECTORY:./data/staging}
    parser-version: ${AI_DOCUMENT_PARSER_VERSION:v1}
    ingestion-core-size: ${AI_DOCUMENT_INGESTION_CORE_SIZE:2}
    ingestion-max-size: ${AI_DOCUMENT_INGESTION_MAX_SIZE:4}
    ingestion-queue-capacity: ${AI_DOCUMENT_INGESTION_QUEUE_CAPACITY:100}
    max-upload-bytes: ${AI_DOCUMENT_MAX_UPLOAD_BYTES:20971520}

  rag:
    top-k: 5
    similarity-threshold: 0.7
    # 当前正式银标评测中向量检索优于等权混合检索，默认走向量基线。
    enable-hybrid-search: ${AI_RAG_ENABLE_HYBRID_SEARCH:false}
    hybrid-vector-weight: ${AI_RAG_HYBRID_VECTOR_WEIGHT:0.95}
    hybrid-bm25-weight: ${AI_RAG_HYBRID_BM25_WEIGHT:0.05}
    hybrid-rrf-k: ${AI_RAG_HYBRID_RRF_K:60}
    hybrid-vector-candidate-top-k: ${AI_RAG_HYBRID_VECTOR_CANDIDATE_TOP_K:20}
    hybrid-bm25-candidate-top-k: ${AI_RAG_HYBRID_BM25_CANDIDATE_TOP_K:20}
    hybrid-bm25-corpus-max-docs: ${AI_RAG_HYBRID_BM25_CORPUS_MAX_DOCS:5000}
    hybrid-corpus-bm25-enabled: ${AI_RAG_HYBRID_CORPUS_BM25_ENABLED:false}
    hybrid-mysql-fulltext-enabled: ${AI_RAG_HYBRID_MYSQL_FULLTEXT_ENABLED:false}
    hybrid-mysql-candidate-top-k: ${AI_RAG_HYBRID_MYSQL_CANDIDATE_TOP_K:20}
    hybrid-preserve-vector-top-k: ${AI_RAG_HYBRID_PRESERVE_VECTOR_TOP_K:1}
    hybrid-cross-encoder-enabled: ${AI_RAG_HYBRID_CROSS_ENCODER_ENABLED:false}
    hybrid-rerank-candidate-top-k: ${AI_RAG_HYBRID_RERANK_CANDIDATE_TOP_K:40}
    hybrid-rerank-fail-open: ${AI_RAG_HYBRID_RERANK_FAIL_OPEN:true}
    bm25-stopword-enabled: ${AI_RAG_BM25_STOPWORD_ENABLED:true}
    adaptive:
      enabled: true
      max-retrieval-rounds: 2
      max-context-chunks: 5
      verification-threshold: ${AI_RAG_VERIFICATION_THRESHOLD:0.72}
      multi-hop-threshold: ${AI_RAG_MULTI_HOP_THRESHOLD:0.78}
      direct-threshold: 0.45
      min-keyword-count: 2
      semantic-rerank-enabled: ${AI_RAG_SEMANTIC_RERANK_ENABLED:true}
      rerank-provider: ${AI_RAG_RERANK_PROVIDER:embedding}
      semantic-rerank-top-k: ${AI_RAG_SEMANTIC_RERANK_TOP_K:5}
      semantic-rerank-min-score: ${AI_RAG_SEMANTIC_RERANK_MIN_SCORE:0.62}
      minimum-keyword-coverage: ${AI_RAG_MINIMUM_KEYWORD_COVERAGE:0.60}
      answer-support-enabled: ${AI_RAG_ANSWER_SUPPORT_ENABLED:true}
      answer-support-min-score: ${AI_RAG_ANSWER_SUPPORT_MIN_SCORE:0.68}
      answer-support-min-ratio: ${AI_RAG_ANSWER_SUPPORT_MIN_RATIO:0.8}
      cross-encoder:
        endpoint: ${AI_RAG_RERANK_ENDPOINT:https://api.siliconflow.cn/v1/rerank}
        api-key: ${AI_RAG_RERANK_API_KEY:${SILICONFLOW_API_KEY:}}
        model-name: ${AI_RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
        min-score: ${AI_RAG_RERANK_MIN_SCORE:0.55}
        timeout-ms: ${AI_RAG_RERANK_TIMEOUT_MS:10000}
        max-document-characters: ${AI_RAG_RERANK_MAX_DOCUMENT_CHARACTERS:4000}
        fallback-to-embedding: ${AI_RAG_RERANK_FALLBACK_TO_EMBEDDING:false}

  evaluation:
    dataset-directory: ${AI_EVALUATION_DATASET_DIRECTORY:./examples/evaluation-datasets}
    max-dataset-bytes: ${AI_EVALUATION_MAX_DATASET_BYTES:20971520}
    max-cases: ${AI_EVALUATION_MAX_CASES:10000}
    max-concurrent-runs: ${AI_EVALUATION_MAX_CONCURRENT_RUNS:2}
    report-directory: ${AI_EVALUATION_REPORT_DIRECTORY:./evaluation-reports}
  protection:
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${AI_RATE_LIMIT_REQUESTS_PER_MINUTE:30}
      authentication-requests-per-minute: ${AI_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:10}
      fail-open: ${AI_RATE_LIMIT_FAIL_OPEN:true}
    cost-budget:
      enabled: ${AI_COST_BUDGET_ENABLED:true}
      estimated-tokens-per-minute: ${AI_ESTIMATED_TOKENS_PER_MINUTE:12000}
      max-estimated-tokens-per-request: ${AI_MAX_ESTIMATED_TOKENS_PER_REQUEST:4000}
      max-input-characters: ${AI_MAX_INPUT_CHARACTERS:12000}
      tokens-per-character: ${AI_TOKENS_PER_CHARACTER:1.0}
      prompt-overhead-tokens: ${AI_PROMPT_OVERHEAD_TOKENS:256}
      fail-open: ${AI_COST_BUDGET_FAIL_OPEN:true}
  tool:
    database-query:
      enabled: ${AI_TOOL_DATABASE_QUERY_ENABLED:true}
      max-rows: ${AI_TOOL_DATABASE_MAX_ROWS:100}
      query-timeout-seconds: ${AI_TOOL_DATABASE_QUERY_TIMEOUT_SECONDS:5}
      allowed-tables: ${AI_TOOL_DATABASE_ALLOWED_TABLES:conversations,messages,documents,document_chunks,users,ecommerce_qa_pairs,ecommerce_feedback,message_classify_log,vision_analysis_cache}
    api-call:
      enabled: ${AI_TOOL_API_CALL_ENABLED:true}
      timeout: ${AI_TOOL_API_TIMEOUT_MS:30000}
      allowed-methods: ${AI_TOOL_ALLOWED_METHODS:GET,POST}
      # empty allowlist disables outbound API calls; private/loopback hosts are always rejected
      allowed-hosts: ${AI_TOOL_ALLOWED_HOSTS:api.example.com}
      max-request-chars: ${AI_TOOL_MAX_REQUEST_CHARS:8000}
      max-response-chars: ${AI_TOOL_MAX_RESPONSE_CHARS:8000}

  session:
    ttl: 86400
    max-messages: 100
    sliding-window-size: 10
    summary-interval: 5

  security:
    admin-api-key: ${ADMIN_API_KEY:}
    admin-header-name: X-Admin-Api-Key
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 86400000
      issuer: ${JWT_ISSUER:newagent}
      audience: ${JWT_AUDIENCE:newagent-api}
    cors:
      allowed-origins: ${AI_CORS_ALLOWED_ORIGINS:http://localhost:8081}
      allowed-methods: ${AI_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${AI_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Admin-Api-Key,X-Requested-With}
      allow-credentials: ${AI_CORS_ALLOW_CREDENTIALS:false}
      max-age: ${AI_CORS_MAX_AGE:3600}

  observability:
    public-metrics: ${AI_ACTUATOR_PUBLIC_METRICS:false}
  performance:
    async-thread-pool:
      core-size: 20
      max-size: 100
      queue-capacity: 200
    cache:
      ttl: 3600

logging:
  level:
    root: INFO
    com.aiagent: INFO
    dev.langchain4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-agent.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: ${AI_ACTUATOR_EXPOSED_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${AI_ACTUATOR_HEALTH_DETAILS:never}
  metrics:
    tags:
      application: ai-agent-platform
    distribution:
      percentiles-histogram:
        ai.chat.latency: true
        ai.rag.search.latency: true
        ai.document.ingestion.latency: true

# =============================================
# 电商客服知识库导入配置
# =============================================
ecommerce:
  milvus:
    collection: ecommerce_qa
    dimension: 1024
  import-config:
    # 每个批次处理的记录数（embedding 批量 + DB 批量）
    batch-size: 64
    # 批次间隔毫秒，0 表示不等待
    batch-interval-ms: 0
    # 内容哈希去重（record_hash 唯一索引兜底，支持断点续传）
    deduplicate: true
    # 意图分类器（关键词规则，对齐 silver-v2 六类意图）
    classifier:
      enabled: true
      keywords:
        shipping_logistics: ["快递","发货","物流","申通","韵达","顺丰","邮政","签收","运单","几天能到","邮费","送到","寄到","发货单"]
        refund_return: ["退款","退货","退钱","退换","拒收","全额退","寄回","退货运费","能退","退吗","退回来"]
        order_payment: ["付款","支付","下单","改价","订单","抬头","拍下","结算","购买","合并付款","一起付款"]
        promotion_price: ["包邮","优惠","券","折扣","活动","价格","多少钱","满减","免邮","降价","便宜","几折","有活动"]
        product_specification: ["规格","尺寸","斤","袋","包装","颜色","材质","大号","小号","克","毫升","粒","盒","份","几袋"]
        after_sales_quality: ["坏","裂","破","少","缺","质量","售后","补发","换货","变质","发霉","过期","掉渣","瑕疵"]
  generator:
    # 每个类别生成的目标 QA 对数量（100x 提升，预算 3.0 元可支撑 ~8100 条）
    target-per-category: 500
    # 单次 API 调用生成的条目数（增大减少 API 调用次数）
    batch-size: 20
    # 要生成的类别列表（留空使用默认 8 个类别）
    categories:

# =============================================
# 客服训练数据导入配置
# =============================================
cs:
  import:
    data-dir: ${CS_IMPORT_DATA_DIR:}
    batch-size: 18
  answer:
    minimum-verification-level: ${CS_MINIMUM_VERIFICATION_LEVEL:HIGH}
    handoff-message: ${CS_HANDOFF_MESSAGE:当前知识库没有足够信息可以可靠回答，建议转人工客服进一步处理。}
    max-evidence: ${CS_MAX_EVIDENCE:5}
